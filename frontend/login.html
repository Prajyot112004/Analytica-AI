<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Analytica AI v2</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.1), transparent 40%),
                        var(--bg-main);
        }
        .auth-box {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: var(--radius-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 12px;
        }
        .auth-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .error-alert {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid var(--accent-rose);
            color: var(--accent-rose);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box glass">
            <div class="auth-header">
                <div style="font-size:2.4rem;">🤖</div>
                <div class="auth-title">Analytica AI v2</div>
                <div class="auth-desc">Intelligent Agentic Data Analyst Platform</div>
            </div>

            <div id="errorAlert" class="error-alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px;">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-secondary);">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const errBox = document.getElementById("errorAlert");
            errBox.style.display = "none";

            const formData = new URLSearchParams();
            formData.append("username", document.getElementById("username").value);
            formData.append("password", document.getElementById("password").value);

            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Login failed");

                localStorage.setItem("analytica_token", data.access_token);
                localStorage.setItem("analytica_user", JSON.stringify(data.user));
                window.location.href = "dashboard.html";
            } catch (err) {
                errBox.innerText = err.message;
                errBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
